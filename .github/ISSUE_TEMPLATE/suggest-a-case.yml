name: Suggest a case
description: Tell me about a partnership that belongs in Partnership Turning Points.
title: "Suggestion: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a case. Partnership Turning Points is a selection, not a complete list, and suggestions help fill the gaps.
        I read every one, though not every suggestion will make it into an edition.
  - type: input
    id: case
    attributes:
      label: The partnership
      description: Both partners and the name of the deal, for example Adidas and Run-DMC, My Adidas.
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      description: The year it was signed, launched or ended.
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Which edition would it suit?
      options:
        - Not sure
        - Fame first
        - Proof first
        - Money first
        - Culture first
        - Failure first
        - Platform first
        - Edge first
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: What did each side bring, and what changed? A sentence or two is plenty.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, if you know of any
      description: A deal value, a sales figure or a report that shows what it achieved, and for which partner.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
      description: The announcement, a source or a film.
    validations:
      required: false
